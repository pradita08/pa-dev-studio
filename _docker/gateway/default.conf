# Satu pintu masuk untuk seluruh situs.
#
#   /             → pa_dev      (React + Vite, homepage publik)
#   /auth/        → pa_dev_api  (PA DEV Auth, halaman login)
#   /adminpanel/  → pa_dev_api  (PA DEV Admin, dashboard)
#   /api/         → pa_dev_api  (API JWT)
#
# Semua di bawah satu origin supaya cookie sesi httpOnly berlaku untuk halaman
# admin sekaligus panggilan API, tanpa CORS dan tanpa cookie lintas port.

upstream padev_web {
    server pa_dev:3000;
}

upstream padev_api {
    server pa_dev_api:4000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # Diteruskan apa adanya supaya API tahu IP asli klien — dipakai pembatas
    # percobaan login.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /auth {
        proxy_pass http://padev_api;
    }

    location /adminpanel {
        proxy_pass http://padev_api;
    }

    location /api {
        proxy_pass http://padev_api;
    }

    # Gambar konten hasil unggahan admin.
    location /uploads {
        proxy_pass http://padev_api;
    }

    location /health {
        proxy_pass http://padev_web;
    }

    location /api-health {
        proxy_pass http://padev_api/health;
    }

    location / {
        proxy_pass http://padev_web;
    }
}
